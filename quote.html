<!DOCTYPE html>
<html lang="en-ZA">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Request a Quote | SoftApps Digital Solutions</title>
  <meta name="description" content="Request a quote from SoftApps Digital Solutions for IT support, website development, software development, training and digital solutions.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body data-page="quote">
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <div id="site-header"></div>
  <main id="main-content">
    <section class="page-hero">
      <div class="container">
        <nav class="breadcrumb-nav" aria-label="Breadcrumb"><a href="index.html">Home</a> / Request a Quote</nav>
        <h1>Request a Quote</h1>
        <p>Tell us about your project or service requirements and we'll get back to you with a quotation.</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-lg-8 fade-in">
            <div class="form-card">
              <form data-softapps-form id="quote-form" action="#" method="post" novalidate>
                <div class="row g-3">
                  <div class="col-md-6">
                    <label for="quote-name" class="form-label">Full Name <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="quote-name" name="name" required autocomplete="name">
                  </div>
                  <div class="col-md-6">
                    <label for="quote-company" class="form-label">Company / Organisation</label>
                    <input type="text" class="form-control" id="quote-company" name="company" autocomplete="organization">
                  </div>
                  <div class="col-md-6">
                    <label for="quote-email" class="form-label">Email Address <span class="text-danger">*</span></label>
                    <input type="email" class="form-control" id="quote-email" name="email" required autocomplete="email">
                  </div>
                  <div class="col-md-6">
                    <label for="quote-phone" class="form-label">Phone Number <span class="text-danger">*</span></label>
                    <input type="tel" class="form-control" id="quote-phone" name="phone" required autocomplete="tel">
                  </div>
                  <div class="col-12">
                    <label for="quote-service" class="form-label">Service Required <span class="text-danger">*</span></label>
                    <select class="form-select" id="quote-service" name="service" required>
                      <option value="">Select a service</option>
                      <option value="IT Support">IT Support</option>
                      <option value="Website Development">Website Development</option>
                      <option value="Software Development">Software Development</option>
                      <option value="Digital Solutions">Digital Solutions</option>
                      <option value="Computer Training">Computer Training</option>
                      <option value="Programming Training">Programming Training</option>
                      <option value="IT Hardware">IT Hardware</option>
                      <option value="Other">Other</option>
                    </select>
                  </div>
                  <div class="col-12">
                    <label for="quote-description" class="form-label">Project Description <span class="text-danger">*</span></label>
                    <textarea class="form-control" id="quote-description" name="description" rows="4" required placeholder="Describe your project or service requirements…"></textarea>
                  </div>
                  <div class="col-md-6">
                    <label for="quote-budget" class="form-label">Budget Range</label>
                    <select class="form-select" id="quote-budget" name="budget">
                      <option value="">Select budget range (optional)</option>
                      <option>Under R5,000</option>
                      <option>R5,000 – R15,000</option>
                      <option>R15,000 – R50,000</option>
                      <option>R50,000+</option>
                      <option>Not sure yet</option>
                    </select>
                  </div>
                  <div class="col-md-6">
                    <label for="quote-contact-method" class="form-label">Preferred Contact Method</label>
                    <select class="form-select" id="quote-contact-method" name="contact_method">
                      <option value="">Select preference</option>
                      <option>Email</option>
                      <option>Phone</option>
                      <option>WhatsApp</option>
                    </select>
                  </div>
                  <div class="col-12">
                    <label for="quote-additional" class="form-label">Additional Information</label>
                    <textarea class="form-control" id="quote-additional" name="additional" rows="3" placeholder="Any other details you'd like to share…"></textarea>
                  </div>
                  <div class="col-12">
                    <button type="submit" class="btn btn-softapps btn-primary-softapps btn-lg w-100 w-md-auto">Request a Quote</button>
                  </div>
                  <div class="col-12 form-success d-none alert alert-success" role="alert">
                    Thank you! Your quote request has been received. We will contact you shortly.
                  </div>
                </div>
              </form>
            </div>
            <p class="text-muted text-center mt-4"><small>Prefer to talk directly? Call <a href="tel:+27631604297">063 160 4297</a> or <a href="https://wa.me/27631604297">WhatsApp us</a>.</small></p>
          </div>
        </div>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/script.js"></script>
  <script>
    /* Pre-select service from URL query param e.g. ?service=website */
    (function () {
      var params = new URLSearchParams(window.location.search);
      var service = params.get('service');
      var map = {
        'software': 'Software Development',
        'website': 'Website Development',
        'it-support': 'IT Support',
        'training': 'Computer Training',
        'hardware': 'IT Hardware',
        'digital': 'Digital Solutions'
      };
      if (service && map[service]) {
        var sel = document.getElementById('quote-service');
        if (sel) sel.value = map[service];
      }
    })();
  </script>
</body>
</html>
